name: one-time skill combo restoration

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up parser
        run: python -m pip install beautifulsoup4
      - name: Restore complete combo-skill section
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from bs4 import BeautifulSoup, NavigableString, Tag
          from copy import copy
          from pathlib import Path
          import html
          import re

          source_path = Path('reference/psnovanet/psnova/!skill工事中excelが土方/スキル - ファンタシースターノヴァ PSNOVA 攻略Wiki.html')
          public_path = Path('docs/pages/skill.html')

          source = BeautifulSoup(source_path.read_text(encoding='utf-8'), 'html.parser')

          def heading_text(tag):
              return tag.get_text(' ', strip=True) if isinstance(tag, Tag) else ''

          combo_h2 = next(
              h for h in source.find_all('h2')
              if heading_text(h).startswith('コンボスキル')
          )
          many_h2 = next(
              h for h in source.find_all('h2')
              if heading_text(h).startswith('組み合わせの多いコンボスキル')
          )
          comment_h3 = next(
              h for h in source.find_all('h3')
              if heading_text(h).startswith('コメント') and h.find_previous('h2') == many_h2
          )

          def iter_between(start, end):
              node = start.next_sibling
              while node is not None and node is not end:
                  yield node
                  node = node.next_sibling

          def clean_table(table):
              frag = BeautifulSoup(str(table), 'html.parser')
              t = frag.find('table')

              # Remove the source site's table-edit column. It has no reader-facing text.
              for tr in t.find_all('tr'):
                  cells = tr.find_all(['th', 'td'], recursive=False)
                  if cells:
                      last = cells[-1]
                      if last.find('img') and not last.get_text(' ', strip=True):
                          last.decompose()

              # Keep meaningful internal "リスト参照" links, but never archive/source URLs.
              for a in list(t.find_all('a')):
                  text = a.get_text(' ', strip=True)
                  href = a.get('href', '')
                  m = re.search(r'#([A-Za-z0-9_-]+)$', href)
                  if text and m:
                      a.attrs = {'href': '#' + m.group(1)}
                  elif text:
                      a.unwrap()
                  else:
                      a.decompose()

              for img in list(t.find_all('img')):
                  img.decompose()
              for span in list(t.find_all('span')):
                  span.unwrap()

              for cell in t.find_all('td'):
                  if cell.find_parent('thead') is not None:
                      cell.name = 'th'

              for tag in t.find_all(True):
                  keep = {}
                  for attr in ('rowspan', 'colspan', 'href', 'id'):
                      if tag.has_attr(attr):
                          keep[attr] = tag[attr]
                  tag.attrs = keep
              t.attrs = {}

              return str(t)

          def label_from_ul(node):
              if not isinstance(node, Tag) or node.name != 'ul':
                  return None
              li = node.find('li', recursive=False)
              if not li:
                  return None
              return li.get_text(' ', strip=True)

          def anchor_id_before(node):
              prev = node.previous_sibling
              while prev is not None:
                  if isinstance(prev, NavigableString) and not prev.strip():
                      prev = prev.previous_sibling
                      continue
                  if isinstance(prev, Tag) and prev.name == 'a' and prev.get('id'):
                      return prev['id']
                  break
              return None

          def convert_segment(start, end, detailed=False):
              out = []
              table_count = 0
              for node in iter_between(start, end):
                  if isinstance(node, NavigableString):
                      continue
                  if not isinstance(node, Tag):
                      continue

                  label = label_from_ul(node)
                  if label:
                      if detailed and label == '名前':
                          out.append('                    <h4>表の見方</h4>')
                      else:
                          anchor = anchor_id_before(node)
                          ident = f' id="{html.escape(anchor)}"' if anchor else ''
                          out.append(f'                    <h4{ident}>{html.escape(label)}</h4>')
                      continue

                  table = node.find('table') if node.name != 'table' else node
                  if table is not None:
                      cleaned = clean_table(table)
                      out.append('                    <div class="table-scroll">')
                      out.append('                        ' + cleaned.replace('\n', '\n                        '))
                      out.append('                    </div>')
                      table_count += 1
              return out, table_count

          main_html, main_tables = convert_segment(combo_h2, many_h2, detailed=False)
          detailed_html, detailed_tables = convert_segment(many_h2, comment_h3, detailed=True)

          fragment = [
              '                    <h3 id="combo-skills">コンボスキル</h3>',
              '                    <p>複数のスキルを組み合わせることで、HP・GP・各種攻撃力や防御力を高める上位スキルなどを発動できる。各表では発動するコンボスキル、必要な組み合わせ、効果を確認できる。</p>',
              *main_html,
              '',
              '                    <h3 id="combo-skills-many">組み合わせの多いコンボスキル</h3>',
              '                    <p>組み合わせ候補が多いコンボスキルは、発動条件と候補を個別にまとめる。</p>',
              *detailed_html,
          ]
          fragment_text = '\n'.join(fragment)

          public = public_path.read_text(encoding='utf-8')
          placeholder = re.compile(
              r'                    <h3 id="combo-skills">コンボスキル</h3>\n'
              r'                    <p>.*?</p>',
              re.S,
          )
          if len(placeholder.findall(public)) != 1:
              raise SystemExit('expected exactly one public combo placeholder')
          updated = placeholder.sub(fragment_text, public, count=1)

          total_source_tables = main_tables + detailed_tables
          generated = BeautifulSoup(fragment_text, 'html.parser')
          generated_tables = generated.find_all('table')
          if len(generated_tables) != total_source_tables:
              raise SystemExit(f'table count mismatch: source {total_source_tables}, generated {len(generated_tables)}')
          if total_source_tables < 10:
              raise SystemExit(f'unexpectedly small combo section: {total_source_tables} tables')

          required = [
              'HPアップⅢ', 'ガードGP変換', 'スーパーアーマー',
              '組み合わせの多いコンボスキル', 'HPアップⅤ', 'ウォンドリアクター',
              '射撃力・法撃力の40%をウォンドの打撃力に加算する。',
          ]
          for text in required:
              if text not in fragment_text:
                  raise SystemExit(f'missing required combo data: {text}')

          forbidden = ['web.archive.org', 'paraedit.png', 'mini_add.png', 'コメントページを参照', '攻略Wiki']
          for text in forbidden:
              if text in fragment_text:
                  raise SystemExit(f'source chrome leaked into public fragment: {text}')

          # Compare normalized reader-facing table text after removing source edit columns.
          source_tables = []
          for start, end in ((combo_h2, many_h2), (many_h2, comment_h3)):
              for node in iter_between(start, end):
                  if isinstance(node, Tag):
                      table = node.find('table') if node.name != 'table' else node
                      if table is not None:
                          source_tables.append(BeautifulSoup(clean_table(table), 'html.parser').get_text(' ', strip=True))
          generated_texts = [t.get_text(' ', strip=True) for t in generated_tables]
          if source_tables != generated_texts:
              raise SystemExit('cleaned source table text differs from generated public table text')

          public_path.write_text(updated, encoding='utf-8')
          print(f'restored combo tables: {total_source_tables}')
          PY
          git add docs/pages/skill.html
          git commit -m "fix: restore complete combo skill data"
      - name: Verify restored public page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          p = Path('docs/pages/skill.html')
          s = p.read_text(encoding='utf-8')
          soup = BeautifulSoup(s, 'html.parser')
          combo = soup.find('h3', id='combo-skills')
          many = soup.find('h3', id='combo-skills-many')
          if combo is None or many is None:
              raise SystemExit('combo headings missing')
          tables = []
          node = combo.find_next_sibling()
          while node is not None:
              if getattr(node, 'name', None) == 'h3' and node.get('id') not in ('combo-skills-many',):
                  break
              if getattr(node, 'name', None) == 'div' and 'table-scroll' in node.get('class', []):
                  table = node.find('table')
                  if table:
                      tables.append(table)
              node = node.find_next_sibling()
          if len(tables) < 10:
              raise SystemExit(f'public combo section has only {len(tables)} tables')
          if 'ウォンドリアクター' not in s:
              raise SystemExit('last detailed combo skill missing')
          if 'web.archive.org' in s or 'paraedit.png' in s:
              raise SystemExit('archive chrome leaked into skill page')
          print(f'public combo tables: {len(tables)}')
          PY
          python3 - <<'PY'
          from tests.test_public_copy_source_provenance import test_public_copy_does_not_expose_source_provenance
          test_public_copy_does_not_expose_source_provenance()
          print('source-neutrality regression: pass')
          PY
      - name: Remove workflow and push
        shell: bash
        run: |
          rm .github/workflows/restore-skill-combos.yml
          git add .github/workflows/restore-skill-combos.yml
          git commit -m "chore: remove skill combo restoration workflow"
          git push origin HEAD:master
