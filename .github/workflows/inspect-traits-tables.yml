name: one-time traits table inspection

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install parser
        run: python -m pip install beautifulsoup4
      - name: Compare cleaned source and public trait tables
        shell: bash
        run: |
          python3 - <<'PY'
          from bs4 import BeautifulSoup, Tag
          from pathlib import Path
          import re

          src_path = Path('reference/psnovanet/psnova/特徴 - ファンタシースターノヴァ PSNOVA 攻略Wiki.html')
          pub_path = Path('docs/pages/traits.html')

          def norm(s):
              return re.sub(r'\s+', ' ', s).strip()

          def clean_rows(table, source=False):
              result = []
              for tr in table.find_all('tr'):
                  vals = []
                  for cell in tr.find_all(['th','td'], recursive=False):
                      clone = BeautifulSoup(str(cell), 'html.parser')
                      for img in clone.find_all('img'):
                          img.decompose()
                      for a in clone.find_all('a'):
                          a.unwrap()
                      text = norm(clone.get_text(' ', strip=True))
                      if source and not text:
                          continue
                      vals.append(text)
                  if vals and any(vals):
                      result.append(vals)
              return result

          src = BeautifulSoup(src_path.read_text(encoding='utf-8'), 'html.parser')
          start = src.find('h3', id='content_1_0')
          if start is None:
              raise SystemExit('source start heading missing')
          source_tables = []
          for table in src.find_all('table'):
              # Only tables after the first article heading and before comments.
              prev_h = table.find_previous(['h2','h3','h4'])
              if prev_h is None:
                  continue
              # Compare document positions via source string index is unreliable; walk preceding headings instead.
              headings = [norm(h.get_text(' ', strip=True)) for h in table.find_all_previous(['h2','h3','h4'])]
              if not any('アークス系' in h for h in headings):
                  continue
              if any(h.startswith('コメント') for h in headings[:1]):
                  continue
              # Exclude sidebar/chrome tables by requiring the table to be in the main body after content_1_0.
              if table.sourceline is not None and start.sourceline is not None and table.sourceline <= start.sourceline:
                  continue
              comment = src.find(['h2','h3','h4'], string=lambda s: s and 'コメント' in s)
              if comment is not None and table.sourceline is not None and comment.sourceline is not None and table.sourceline >= comment.sourceline:
                  continue
              rows = clean_rows(table, source=True)
              if rows and rows[0] and rows[0][0] == '特徴名':
                  source_tables.append(rows)

          pub = BeautifulSoup(pub_path.read_text(encoding='utf-8'), 'html.parser')
          public_tables = [clean_rows(t) for t in pub.find('main', id='main').find_all('table')]

          print('SOURCE_TABLES', len(source_tables))
          print('PUBLIC_TABLES', len(public_tables))
          if len(source_tables) != 6 or len(public_tables) != 6:
              print('Unexpected table counts; dumping headers')
              print('source headers:', [r[0] for r in source_tables])
              print('public headers:', [r[0] for r in public_tables])
              raise SystemExit(2)

          for idx, (srows, prows) in enumerate(zip(source_tables, public_tables), 1):
              print('\n' + '='*90)
              print(f'TABLE {idx} source_rows={len(srows)-1} public_rows={len(prows)-1}')
              print('SOURCE_HEADER', srows[0])
              print('PUBLIC_HEADER', prows[0])
              maxlen = max(len(srows), len(prows))
              diffs = 0
              for i in range(maxlen):
                  sr = srows[i] if i < len(srows) else ['<MISSING>']
                  pr = prows[i] if i < len(prows) else ['<MISSING>']
                  if sr != pr:
                      diffs += 1
                      print(f'ROW {i}:')
                      print('  SOURCE:', sr)
                      print('  PUBLIC:', pr)
              print('DIFF_ROWS', diffs)
          PY
      - name: Remove inspection workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/inspect-traits-tables.yml
          git add .github/workflows/inspect-traits-tables.yml
          git commit -m "chore: remove traits table inspection workflow"
          git push origin HEAD:master
