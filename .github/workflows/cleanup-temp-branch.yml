name: Cleanup accidental branch

on:
  push:
    paths:
      - ".github/workflows/cleanup-temp-branch.yml"

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'cleanup accidental branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete accidental branch and self-remove
        run: |
          git push origin --delete DO_NOT_USE || true
          rm .github/workflows/cleanup-temp-branch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/cleanup-temp-branch.yml
          git commit -m "remove temporary branch cleanup workflow"
          git pull --rebase origin master
          git push origin master
