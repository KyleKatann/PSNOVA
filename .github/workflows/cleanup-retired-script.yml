name: one-time retired script cleanup

on:
  push:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove retired script references
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          token = '/PSNOVA/js/fixmenu_pagetop.js'
          pages = [Path('docs/index.html'), *Path('docs/pages').rglob('*.html')]
          changed = 0

          for path in pages:
              if '分類中' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              lines = text.splitlines(keepends=True)
              updated_lines = [line for line in lines if token not in line]
              if updated_lines == lines:
                  continue
              path.write_text(''.join(updated_lines), encoding='utf-8', newline='\n')
              changed += 1

          Path('docs/fixmenu-pagetop-compat.txt').unlink(missing_ok=True)

          remaining = [
              str(path) for path in pages
              if '分類中' not in path.parts
              and token in path.read_text(encoding='utf-8')
          ]
          if remaining:
              raise SystemExit('remaining: ' + ', '.join(remaining))

          print('updated HTML files:', changed)
          PY
      - name: Commit and remove this workflow
        shell: bash
        run: |
          rm .github/workflows/cleanup-retired-script.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs .github/workflows/cleanup-retired-script.yml
          git diff --cached --check
          git commit -m "fix: remove retired page-top script references"
          git push origin HEAD:master
