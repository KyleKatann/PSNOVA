name: one-time traits reader-copy cleanup

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make traits note direct
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/pages/traits.html')
          text = path.read_text(encoding='utf-8')
          old = 'ガーネットの特徴。経験値 +10% は機能していないとの注記がある'
          new = 'ガーネットの特徴。経験値 +10% は機能しない'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one match, got {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git add docs/pages/traits.html
          git commit -m "fix: make Garnet trait note direct"
      - name: Verify exact trait note
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('docs/pages/traits.html').read_text(encoding='utf-8')
          if 'ガーネットの特徴。経験値 +10% は機能しない' not in text:
              raise SystemExit('direct Garnet note missing')
          if 'との注記がある' in text:
              raise SystemExit('source-narration phrase remains')
          print('traits reader-copy cleanup: pass')
          PY
      - name: Remove workflow and push
        shell: bash
        run: |
          rm .github/workflows/fix-traits-reader-copy.yml
          git add .github/workflows/fix-traits-reader-copy.yml
          git commit -m "chore: remove traits reader-copy cleanup workflow"
          git push origin HEAD:master
