name: one-time static lazy image migration

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move lazy loading hints into static HTML
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          img_re = re.compile(r'<img\b[^>]*>', re.IGNORECASE)
          src_re = re.compile(r'\bsrc=["\']([^"\']+)["\']', re.IGNORECASE)
          loading_re = re.compile(r'\bloading\s*=', re.IGNORECASE)
          public = [Path('docs/index.html'), *Path('docs/pages').rglob('*.html')]
          changed_files = []
          added = 0

          def migrate_tag(tag: str) -> str:
              nonlocal_added[0] = False
              src_match = src_re.search(tag)
              src = src_match.group(1) if src_match else ''
              if src == '/PSNOVA/img/logo.png' or loading_re.search(tag):
                  return tag
              nonlocal_added[0] = True
              if tag.endswith('/>'):
                  return tag[:-2] + ' loading="lazy"/>'
              return tag[:-1] + ' loading="lazy">'

          for path in public:
              if '分類中' in path.parts:
                  continue
              before = path.read_text(encoding='utf-8')
              parts = []
              cursor = 0
              file_added = 0
              for match in img_re.finditer(before):
                  parts.append(before[cursor:match.start()])
                  tag = match.group(0)
                  nonlocal_added = [False]
                  migrated = migrate_tag(tag)
                  if nonlocal_added[0]:
                      file_added += 1
                  parts.append(migrated)
                  cursor = match.end()
              parts.append(before[cursor:])
              after = ''.join(parts)

              if after == before:
                  continue
              if not after.strip():
                  raise SystemExit(f'{path}: page became empty')
              if after.replace(' loading="lazy"', '') != before:
                  raise SystemExit(f'{path}: change was not limited to lazy attributes')
              path.write_text(after, encoding='utf-8', newline='\n')
              changed_files.append(str(path))
              added += file_added

          violations = []
          for path in public:
              if '分類中' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              for tag in img_re.findall(text):
                  src_match = src_re.search(tag)
                  src = src_match.group(1) if src_match else ''
                  if src != '/PSNOVA/img/logo.png' and 'loading="lazy"' not in tag:
                      violations.append(f'{path}: {src}')
          if violations:
              raise SystemExit('non-logo images without static lazy loading: ' + ', '.join(violations))

          print(f'changed files: {len(changed_files)}')
          print(f'added lazy attributes: {added}')
          PY
      - name: Commit migration and remove workflow
        shell: bash
        run: |
          rm .github/workflows/static-lazy-images.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs .github/workflows/static-lazy-images.yml
          git diff --cached --check
          git commit -m "fix: make image loading hints static"
          git push origin HEAD:master
