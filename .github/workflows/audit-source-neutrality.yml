name: one-time source-neutrality audit

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit broader source-dependent wording
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          pattern = re.compile(r'Wiki|wiki|原典|原文|アーカイブ|参考元|移植元|元ページ|出典|Tipsでは|記録として掲載')
          hits = []
          for path in Path('docs').rglob('*.html'):
              if '分類中' in path.parts:
                  continue
              for lineno, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if pattern.search(line):
                      hits.append((path, lineno, line.strip()))
          print(f'HIT_COUNT={len(hits)}')
          for path, lineno, line in hits:
              print(f'{path}:{lineno}: {line}')
          PY
      - name: Remove audit workflow
        shell: bash
        run: |
          rm .github/workflows/audit-source-neutrality.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+KyleKatann@users.noreply.github.com"
          git add .github/workflows/audit-source-neutrality.yml
          git commit -m "chore: remove one-time source-neutrality audit"
          git push origin HEAD:master
