name: 全ページタイトル正規化

on:
  push:
    branches:
      - master
    paths:
      - .github/page-title-migration-request.json

permissions:
  contents: write
  pages: write

concurrency:
  group: page-title-migration-master
  cancel-in-progress: false

jobs:
  normalize-page-titles:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: masterとリクエストを確認
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "master"
          test -z "$(git status --porcelain)"
          python - <<'PY'
          import json
          from pathlib import Path

          request_path = Path('.github/page-title-migration-request.json')
          if not request_path.is_file():
              raise SystemExit('全ページタイトル修正リクエストが存在しないため停止')
          request = json.loads(request_path.read_text(encoding='utf-8'))
          if request != {'scope': 'sitemap-html'}:
              raise SystemExit('全ページタイトル修正リクエストの内容が不正なため停止')
          PY

      - name: 対象全ページを事前検証
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from urllib.parse import urlparse

          SITE_PREFIX = '/PSNOVA/'
          root = ET.fromstring(Path('docs/sitemap.xml').read_text(encoding='utf-8'))
          ns = {'s': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls = [node.text for node in root.findall('s:url/s:loc', ns)]
          if not urls:
              raise SystemExit('sitemapに対象URLがないため停止')

          paths = []
          for url in urls:
              parsed = urlparse(url)
              if parsed.scheme != 'https' or parsed.netloc != 'kylekatann.github.io':
                  raise SystemExit(f'sitemapに想定外ドメインがあるため停止: {url}')
              if not parsed.path.startswith(SITE_PREFIX):
                  raise SystemExit(f'sitemapに想定外パスがあるため停止: {url}')
              relative = parsed.path[len(SITE_PREFIX):]
              path = Path('docs/index.html') if relative == '' else Path('docs') / relative
              if path.suffix != '.html' or not path.is_file():
                  raise SystemExit(f'sitemap対象HTMLが存在しないため停止: {path}')
              paths.append(path)

          if len(paths) != len(set(paths)):
              raise SystemExit('sitemapにHTMLの重複があるため停止')

          title_re = re.compile(r'<title>(.*?)</title>', re.S)
          og_re = re.compile(r'<meta\s+property="og:title"\s+content="([^"]*)"\s*/?>', re.S)
          main_re = re.compile(r'<main\b[^>]*>.*?</main>', re.S)
          h1_re = re.compile(r'<h1\b[^>]*>(.*?)</h1>', re.S)

          for path in paths:
              text = path.read_text(encoding='utf-8')
              if '<h1 id="logo">' in text:
                  raise SystemExit(f'ロゴH1が残っているため停止: {path}')
              if text.count('<div id="logo">') != 1:
                  raise SystemExit(f'ロゴdivが1件ではないため停止: {path}')
              if len(title_re.findall(text)) != 1:
                  raise SystemExit(f'titleが1件ではないため停止: {path}')
              if len(og_re.findall(text)) != 1:
                  raise SystemExit(f'og:titleが1件ではないため停止: {path}')
              mains = main_re.findall(text)
              if len(mains) != 1:
                  raise SystemExit(f'mainが1件ではないため停止: {path}')
              headings = h1_re.findall(mains[0])
              if len(headings) != 1:
                  raise SystemExit(f'本文H1が1件ではないため停止: {path}')
              heading_text = re.sub(r'<[^>]+>', ' ', headings[0])
              heading_text = ' '.join(html.unescape(heading_text).split())
              if not heading_text:
                  raise SystemExit(f'本文H1が空のため停止: {path}')

          print(f'事前検証完了: {len(paths)}ページ')
          PY

      - name: Gitのコミット設定
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "NORMALIZE_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: sitemap掲載HTMLのtitle順を1ページずつ正規化
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html
          import re
          import subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from urllib.parse import urlparse

          SITE_NAME = 'PSNOVA攻略サイト'
          SITE_PREFIX = '/PSNOVA/'
          root = ET.fromstring(Path('docs/sitemap.xml').read_text(encoding='utf-8'))
          ns = {'s': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls = [node.text for node in root.findall('s:url/s:loc', ns)]

          title_re = re.compile(r'<title>(.*?)</title>', re.S)
          og_re = re.compile(r'<meta\s+property="og:title"\s+content="([^"]*)"\s*/?>', re.S)
          main_re = re.compile(r'<main\b[^>]*>.*?</main>', re.S)
          h1_re = re.compile(r'<h1\b[^>]*>(.*?)</h1>', re.S)

          for url in urls:
              relative = urlparse(url).path[len(SITE_PREFIX):]
              path = Path('docs/index.html') if relative == '' else Path('docs') / relative
              text = path.read_text(encoding='utf-8')
              main = main_re.search(text).group(0)
              heading = h1_re.search(main)
              heading_text = re.sub(r'<[^>]+>', ' ', heading.group(1))
              heading_text = ' '.join(html.unescape(heading_text).split())
              desired_title = SITE_NAME if path == Path('docs/index.html') else f'{SITE_NAME} - {heading_text}'
              escaped_title = html.escape(desired_title, quote=False)
              escaped_og = html.escape(desired_title, quote=True)

              current_title = html.unescape(title_re.search(text).group(1)).strip()
              current_og = html.unescape(og_re.search(text).group(1)).strip()
              if current_title == desired_title and current_og == desired_title:
                  continue

              text = title_re.sub(f'<title>{escaped_title}</title>', text, count=1)
              text = og_re.sub(f'<meta property="og:title" content="{escaped_og}">', text, count=1)

              if html.unescape(title_re.search(text).group(1)).strip() != desired_title:
                  raise SystemExit(f'title更新の検証に失敗したため停止: {path}')
              if html.unescape(og_re.search(text).group(1)).strip() != desired_title:
                  raise SystemExit(f'og:title更新の検証に失敗したため停止: {path}')

              with path.open('w', encoding='utf-8', newline='\n') as handle:
                  handle.write(text)

              subprocess.run(['git', 'diff', '--check'], check=True)
              changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
              if changed != [str(path)]:
                  raise SystemExit(f'想定外の変更ファイルを検知したため停止: {changed}')
              subprocess.run(['git', 'add', str(path)], check=True)
              subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
              staged = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
              if staged != [str(path)]:
                  raise SystemExit(f'想定外のステージ済みファイルを検知したため停止: {staged}')
              subprocess.run(['git', 'commit', '-m', f'{heading_text}ページのタイトル順を正規化'], check=True)
          PY

      - name: 全体を再検証
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from urllib.parse import urlparse

          SITE_NAME = 'PSNOVA攻略サイト'
          SITE_PREFIX = '/PSNOVA/'
          root = ET.fromstring(Path('docs/sitemap.xml').read_text(encoding='utf-8'))
          ns = {'s': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls = [node.text for node in root.findall('s:url/s:loc', ns)]

          for url in urls:
              relative = urlparse(url).path[len(SITE_PREFIX):]
              path = Path('docs/index.html') if relative == '' else Path('docs') / relative
              text = path.read_text(encoding='utf-8')
              if '<h1 id="logo">' in text or text.count('<div id="logo">') != 1:
                  raise SystemExit(f'ロゴ構造が不正なため停止: {path}')
              main = re.search(r'<main\b[^>]*>.*?</main>', text, re.S)
              if not main:
                  raise SystemExit(f'mainがないため停止: {path}')
              headings = re.findall(r'<h1\b[^>]*>(.*?)</h1>', main.group(0), re.S)
              if len(headings) != 1:
                  raise SystemExit(f'本文H1が1件ではないため停止: {path}')
              heading_text = re.sub(r'<[^>]+>', ' ', headings[0])
              heading_text = ' '.join(html.unescape(heading_text).split())
              desired = SITE_NAME if path == Path('docs/index.html') else f'{SITE_NAME} - {heading_text}'
              title = html.unescape(re.search(r'<title>(.*?)</title>', text, re.S).group(1)).strip()
              og_title = html.unescape(re.search(r'<meta\s+property="og:title"\s+content="([^"]*)"\s*/?>', text, re.S).group(1)).strip()
              if title != desired or og_title != desired:
                  raise SystemExit(f'公開タイトル規則に一致しないため停止: {path}')
          PY

          test -z "$(git status --porcelain)"
          git diff --check "$NORMALIZE_BASE"..HEAD
          changed="$(git diff --name-only "$NORMALIZE_BASE"..HEAD)"
          if printf '%s\n' "$changed" | grep -E '\.js$'; then
            echo 'JavaScript変更を検知したため停止' >&2
            exit 1
          fi

      - name: masterへpush
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:master

      - name: GitHub Pagesのbuildを要求
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${{ github.repository }}/pages/builds"
