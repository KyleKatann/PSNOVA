name: tests

on:
  workflow_dispatch:

jobs:
  static-site-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py'
