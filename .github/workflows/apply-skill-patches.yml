name: スキル部分修正

on:
  push:
    branches:
      - master
    paths:
      - .github/skill-patch-request.json
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: skill-patch-master
  cancel-in-progress: false

jobs:
  apply-skill-patches:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: masterを確認
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "master"
          test -z "$(git status --porcelain)"

      - name: Gitのコミット設定
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 部分修正を1件ずつ検証してコミット
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          request_path = Path('.github/skill-patch-request.json')
          target_path = Path('docs/pages/skill.html')

          if not request_path.is_file():
              raise SystemExit('部分修正リクエストが存在しないため停止')

          request = json.loads(request_path.read_text(encoding='utf-8'))
          patches = request.get('patches')
          if not isinstance(patches, list) or not patches:
              raise SystemExit('patchesが空または配列ではないため停止')

          allowed_keys = {'old', 'new', 'message'}

          for index, patch in enumerate(patches, start=1):
              if not isinstance(patch, dict) or set(patch) != allowed_keys:
                  raise SystemExit(f'{index}件目のキー構成が不正なため停止')

              old = patch['old']
              new = patch['new']
              message = patch['message']
              if not all(isinstance(value, str) and value for value in (old, new, message)):
                  raise SystemExit(f'{index}件目に空または文字列以外の値があるため停止')
              if old == new:
                  raise SystemExit(f'{index}件目の置換前後が同一のため停止')

              text = target_path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{index}件目の置換対象が{count}件のため停止')

              updated = text.replace(old, new, 1)
              with target_path.open('w', encoding='utf-8', newline='\n') as handle:
                  handle.write(updated)

              subprocess.run(['git', 'diff', '--check'], check=True)
              changed = subprocess.check_output(
                  ['git', 'diff', '--name-only'], text=True
              ).splitlines()
              if changed != [str(target_path)]:
                  raise SystemExit(
                      f'{index}件目で想定外の変更ファイルを検知したため停止: {changed}'
                  )

              subprocess.run(['git', 'add', str(target_path)], check=True)
              subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
              staged = subprocess.check_output(
                  ['git', 'diff', '--cached', '--name-only'], text=True
              ).splitlines()
              if staged != [str(target_path)]:
                  raise SystemExit(
                      f'{index}件目で想定外のステージ済みファイルを検知したため停止: {staged}'
                  )

              subprocess.run(['git', 'commit', '-m', message], check=True)

          status = subprocess.check_output(
              ['git', 'status', '--porcelain'], text=True
          ).strip()
          if status:
              raise SystemExit(f'処理後のworktreeがcleanではないため停止: {status}')
          PY

      - name: masterへpush
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:master

      - name: GitHub Pagesのbuildを要求
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${{ github.repository }}/pages/builds"
