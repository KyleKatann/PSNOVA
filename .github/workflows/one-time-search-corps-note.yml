name: one-time-search-corps-note

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/one-time-search-corps-note.yml'

permissions:
  contents: write

jobs:
  edit-search-corps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
      - name: Add crew slot column
        shell: python
        run: |
          from pathlib import Path

          path = Path('docs/pages/search-corps.html')
          text = path.read_text(encoding='utf-8')
          old = '''                    <h2>施設の基本情報</h2>
                    <p>探索隊司令部では、クルーを各地へ派遣し、一定日数の経過後に素材やグランピースなどの報酬を受け取れます。派遣先ごとに必要人数・必要日数・危険度・報酬が設定されています。</p>

                    <h2>報酬の仕組み</h2>'''
          new = '''                    <h2>施設の基本情報</h2>
                    <p>探索隊司令部では、クルーを各地へ派遣し、一定日数の経過後に素材やグランピースなどの報酬を受け取れます。派遣先ごとに必要人数・必要日数・危険度・報酬が設定されています。</p>

                    <h2>クルー枠について</h2>
                    <p>施設に配属するクルーと、探索隊司令部の派遣に利用するクルーは別枠ではなく、同じクルー枠を共有します。施設に配属している人数が多いほど、その分だけ派遣に回せる人数も減るため、必要人数の多い派遣を行う際は施設配属との兼ね合いに注意してください。</p>

                    <h2>報酬の仕組み</h2>'''
          if old not in text:
              raise SystemExit('target block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/pages/search-corps.html
          git commit -m "Add crew slot note to search corps page"
          git push origin HEAD:master
