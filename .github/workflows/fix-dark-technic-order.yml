name: one-time dark technic order fix

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore source order without changing section contents
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          path = Path('docs/pages/technic/dark.html')
          text = path.read_text(encoding='utf-8')

          section_re = re.compile(r'<section class="technic-entry"><h2 class="technic-entry-title">(.*?)</h2>.*?</section>')
          matches = list(section_re.finditer(text))
          if len(matches) != 5:
              raise SystemExit(f'expected 5 technic sections, got {len(matches)}')

          blocks = {m.group(1): m.group(0) for m in matches}
          if len(blocks) != 5:
              raise SystemExit('duplicate technic section titles')

          old_order = [m.group(1) for m in matches]
          expected_old = ['メギド', 'ギ・メギド', 'ラ・メギド', 'メギバース', 'サ・メギド']
          if old_order != expected_old:
              raise SystemExit(f'unexpected current order: {old_order}')

          new_order = ['メギド', 'ギ・メギド', 'ラ・メギド', 'サ・メギド', 'メギバース']
          before_hashes = {name: hashlib.sha256(block.encode()).hexdigest() for name, block in blocks.items()}
          before_tables = sum(block.count('<table') for block in blocks.values())
          if before_tables != 15:
              raise SystemExit(f'expected 15 tables before reorder, got {before_tables}')

          start, end = matches[0].start(), matches[-1].end()
          reordered = ''.join(blocks[name] for name in new_order)
          updated = text[:start] + reordered + text[end:]

          old_lead = '闇属性テクニックは、メギド、ギ・メギド、ラ・メギド、メギバース、サ・メギドの5種で構成される。'
          new_lead = '闇属性テクニックは、メギド、ギ・メギド、ラ・メギド、サ・メギド、メギバースの5種で構成される。'
          if updated.count(old_lead) != 1:
              raise SystemExit('expected old lead order exactly once')
          updated = updated.replace(old_lead, new_lead, 1)

          after_matches = list(section_re.finditer(updated))
          after_order = [m.group(1) for m in after_matches]
          if after_order != new_order:
              raise SystemExit(f'wrong reordered sequence: {after_order}')
          after_blocks = {m.group(1): m.group(0) for m in after_matches}
          after_hashes = {name: hashlib.sha256(block.encode()).hexdigest() for name, block in after_blocks.items()}
          if before_hashes != after_hashes:
              raise SystemExit('section contents changed during reorder')
          if sum(block.count('<table') for block in after_blocks.values()) != 15:
              raise SystemExit('table count changed during reorder')

          path.write_text(updated, encoding='utf-8')
          print('dark technic order:', ' -> '.join(after_order))
          PY
          git add docs/pages/technic/dark.html
          git commit -m "fix: restore dark technic source order"
      - name: Verify public order
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('docs/pages/technic/dark.html').read_text(encoding='utf-8')
          order = re.findall(r'<section class="technic-entry"><h2 class="technic-entry-title">(.*?)</h2>', text)
          expected = ['メギド', 'ギ・メギド', 'ラ・メギド', 'サ・メギド', 'メギバース']
          if order != expected:
              raise SystemExit(f'order mismatch: {order}')
          if '闇属性テクニックは、メギド、ギ・メギド、ラ・メギド、サ・メギド、メギバースの5種で構成される。' not in text:
              raise SystemExit('lead order mismatch')
          print('dark technic order verification: pass')
          PY
      - name: Remove workflow and push
        shell: bash
        run: |
          rm .github/workflows/fix-dark-technic-order.yml
          git add .github/workflows/fix-dark-technic-order.yml
          git commit -m "chore: remove dark technic order workflow"
          git push origin HEAD:master
