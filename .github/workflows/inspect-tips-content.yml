name: one-time tips content inspection

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install parser
        run: python -m pip install beautifulsoup4
      - name: Print source and public tips sections for manual review
        shell: bash
        run: |
          python3 - <<'PY'
          from bs4 import BeautifulSoup, Tag, NavigableString
          from pathlib import Path
          import re

          source_path=Path('reference/psnovanet/psnova/小技／バグ - ファンタシースターノヴァ PSNOVA 攻略Wiki.html')
          public_path=Path('docs/pages/tips-bugs.html')

          def norm(s): return re.sub(r'\s+',' ',s).strip()

          def clean(node):
              if not isinstance(node,Tag): return None
              clone=BeautifulSoup(str(node),'html.parser')
              for bad in clone.find_all(['script','style','img']): bad.decompose()
              for a in clone.find_all('a'): a.unwrap()
              text=norm(clone.get_text(' ',strip=True))
              if not text or text in ('編集','添付') or text.startswith('最新の10件を表示しています'): return None
              return text

          def print_doc(label,soup,root):
              print('\n'+'='*100+'\n'+label)
              started=False
              for h in root.find_all(['h2','h3','h4']):
                  title=norm(h.get_text(' ',strip=True))
                  title=re.sub(r'^添付\s*','',title)
                  if title.startswith('コメント'): break
                  if label.startswith('SOURCE') and not started:
                      if '小技' not in title and 'バグ' not in title: continue
                      started=True
                  print(f'\n{h.name.upper()} {title}')
                  items=[]
                  n=h.next_sibling
                  while n is not None:
                      if isinstance(n,Tag) and n.name in ('h2','h3','h4'): break
                      if isinstance(n,Tag) and n.name in ('p','ul','ol','table','div'):
                          t=clean(n)
                          if t: items.append(t)
                      n=n.next_sibling
                  if items:
                      for x in items: print('  ->',x)
                  else: print('  -> (no direct body)')

          pub=BeautifulSoup(public_path.read_text(encoding='utf-8'),'html.parser')
          print_doc('PUBLIC TIPS',pub,pub.find('main',id='main'))
          src=BeautifulSoup(source_path.read_text(encoding='utf-8'),'html.parser')
          anchor=src.find(id='content_1_0'); root=anchor.parent if anchor else src.find(id='content') or src
          print_doc('SOURCE TIPS',src,root)
          PY
      - name: Remove inspection workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/inspect-tips-content.yml
          git add .github/workflows/inspect-tips-content.yml
          git commit -m "chore: remove tips content inspection workflow"
          git push origin HEAD:master
