name: one-time technic content inspection

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install parser
        run: python -m pip install beautifulsoup4
      - name: Expand technic pages for manual review
        shell: bash
        run: |
          python3 - <<'PY'
          from bs4 import BeautifulSoup, Tag
          from pathlib import Path
          import re

          pages = [
              ('炎', 'fire.html'),
              ('氷', 'ice.html'),
              ('雷', 'thunder.html'),
              ('風', 'wind.html'),
              ('光', 'light.html'),
              ('闇', 'dark.html'),
          ]
          source_dir = Path('reference/psnovanet/psnova/!technic工事中excelが土方')

          def clean(text):
              return re.sub(r'\s+', ' ', text).strip()

          def table_summary(table):
              rows = table.find_all('tr')
              parsed = []
              for row in rows:
                  cells = [clean(c.get_text(' ', strip=True)) for c in row.find_all(['th','td'], recursive=False)]
                  # Drop archive edit cells with no meaningful text.
                  cells = [c for c in cells if c]
                  if cells:
                      parsed.append(cells)
              return parsed

          for attr, filename in pages:
              public_path = Path('docs/pages/technic') / filename
              public = BeautifulSoup(public_path.read_text(encoding='utf-8'), 'html.parser')
              main = public.find('main')
              print('\n' + '=' * 90)
              print(f'PUBLIC {attr} {public_path}')
              print('TITLE:', clean(public.title.get_text(' ', strip=True)) if public.title else '')
              print('INLINE_STYLE_CHARS:', sum(len(s.get_text()) for s in public.find_all('style')))
              print('HEADINGS_AND_PROSE:')
              for node in main.find_all(['h2','h3','h4','p'], recursive=True):
                  if node.find_parent('table'):
                      continue
                  text = clean(node.get_text(' ', strip=True))
                  if text:
                      print(f'  {node.name.upper()}: {text}')
              print('TABLES:')
              for i, table in enumerate(main.find_all('table'), 1):
                  rows = table_summary(table)
                  prev = table.find_previous(['h3','h4'])
                  label = clean(prev.get_text(' ', strip=True)) if prev else '(none)'
                  header = rows[0] if rows else []
                  first = rows[1] if len(rows) > 1 else []
                  last = rows[-1] if len(rows) > 1 else []
                  print(f'  #{i} under={label!r} rows={max(0,len(rows)-1)} header={header}')
                  print(f'      first={first}')
                  print(f'      last ={last}')

              candidates = list(source_dir.glob(f'テクニック_{attr}属性 - *.html'))
              if len(candidates) != 1:
                  print(f'SOURCE ERROR candidates={candidates}')
                  continue
              source_path = candidates[0]
              source = BeautifulSoup(source_path.read_text(encoding='utf-8'), 'html.parser')
              # The source content column carries the actual page article; filter out sidebars by locating attribute heading.
              content = source.find(id='content_1_0')
              root = content.parent if content else source
              print(f'SOURCE {attr} {source_path}')
              print('SOURCE_HEADINGS_AND_PROSE:')
              seen = 0
              for node in root.find_all(['h2','h3','h4','p'], recursive=True):
                  text = clean(node.get_text(' ', strip=True))
                  if not text:
                      continue
                  if text.startswith('コメント'):
                      break
                  # Suppress obvious PukiWiki chrome.
                  if text in ('検索', 'メニュー'):
                      continue
                  print(f'  {node.name.upper()}: {text}')
                  seen += 1
                  if seen > 80:
                      print('  ... prose output capped ...')
                      break
              print('SOURCE_TABLES:')
              tables = []
              # Take tables after the page's main attribute h2 and before comments.
              attr_heading = next((h for h in source.find_all(['h2','h3']) if clean(h.get_text(' ', strip=True)).startswith(f'{attr}属性')), None)
              if attr_heading:
                  node = attr_heading
                  while node:
                      node = node.find_next()
                      if node is None:
                          break
                      if node.name in ('h2','h3') and clean(node.get_text(' ', strip=True)).startswith('コメント'):
                          break
                      if node.name == 'table' and not node.find_parent('table'):
                          tables.append(node)
              for i, table in enumerate(tables, 1):
                  rows = table_summary(table)
                  prev = table.find_previous(['h3','h4'])
                  label = clean(prev.get_text(' ', strip=True)) if prev else '(none)'
                  header = rows[0] if rows else []
                  first = rows[1] if len(rows) > 1 else []
                  last = rows[-1] if len(rows) > 1 else []
                  print(f'  #{i} under={label!r} rows={max(0,len(rows)-1)} header={header}')
                  print(f'      first={first}')
                  print(f'      last ={last}')
              print(f'COUNT_COMPARE public={len(main.find_all("table"))} source={len(tables)}')
          PY
      - name: Remove inspection workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/audit-technic-content.yml
          git add .github/workflows/audit-technic-content.yml
          git commit -m "chore: remove technic content inspection workflow"
          git push origin HEAD:master
