name: one-time technic page restore

on:
  push:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Restore technic pages and remove retired tag only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          parent = '8a8ca4076bf0481050501df269bfbe8d01456309'
          token = '<script defer src="/PSNOVA/js/fixmenu_pagetop.js"></script>'
          paths = [
              'docs/pages/technic/fire.html',
              'docs/pages/technic/ice.html',
              'docs/pages/technic/thunder.html',
              'docs/pages/technic/wind.html',
              'docs/pages/technic/light.html',
              'docs/pages/technic/dark.html',
          ]

          for raw_path in paths:
              original = subprocess.check_output(
                  ['git', 'show', f'{parent}:{raw_path}'],
                  text=True,
                  encoding='utf-8',
              )
              if token not in original:
                  raise SystemExit(f'retired tag missing in parent source: {raw_path}')
              restored = original.replace(token, '')
              if not restored.strip():
                  raise SystemExit(f'restored page is empty: {raw_path}')
              if 'fixmenu_pagetop.js' in restored:
                  raise SystemExit(f'retired reference remains: {raw_path}')
              Path(raw_path).write_text(restored, encoding='utf-8', newline='\n')
          PY
      - name: Commit and remove this workflow
        shell: bash
        run: |
          rm .github/workflows/restore-technic-pages.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/pages/technic .github/workflows/restore-technic-pages.yml
          git diff --cached --check
          git commit -m "fix: restore technic pages after script cleanup"
          git push origin HEAD:master
