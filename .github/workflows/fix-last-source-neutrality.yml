name: one-time final source-neutrality cleanup

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix final source-dependent wording
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+KyleKatann@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/pages/tips-bugs.html')
          text = path.read_text(encoding='utf-8')
          old = 'Tipsでは、装甲には打撃、主武装には法撃、副武装には射撃が有効とされている。'
          new = 'ギガンテスの部位ごとの有効攻撃は、装甲には打撃、主武装には法撃、副武装には射撃。'
          if text.count(old) != 1:
              raise SystemExit(f'expected one Tips wording, got {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git add docs/pages/tips-bugs.html
          git commit -m "fix: remove final source-dependent tips wording"
      - name: Extend provenance regression test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/test_public_copy_source_provenance.py')
          text = path.read_text(encoding='utf-8')
          anchor = '    "出典では",\n'
          if text.count(anchor) != 1:
              raise SystemExit('test tuple anchor not found exactly once')
          text = text.replace(anchor, anchor + '    "Tipsでは",\n')
          path.write_text(text, encoding='utf-8')
          PY
          git add tests/test_public_copy_source_provenance.py
          git commit -m "test: reject source-dependent Tips wording"
      - name: Verify source neutrality
        shell: bash
        run: |
          python3 - <<'PY'
          import runpy
          from pathlib import Path
          import re
          ns = runpy.run_path('tests/test_public_copy_source_provenance.py')
          ns['test_public_copy_does_not_expose_source_provenance']()
          pattern = re.compile(r'Wiki|wiki|原典|原文|アーカイブ|参考元|移植元|元ページ|出典|Tipsでは|記録として掲載')
          hits = []
          for path in Path('docs').rglob('*.html'):
              if '分類中' in path.parts:
                  continue
              for lineno, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if pattern.search(line):
                      hits.append(f'{path}:{lineno}: {line.strip()}')
          if hits:
              raise SystemExit('source-dependent wording remains:\n' + '\n'.join(hits))
          print('broad source-neutrality hits: 0')
          PY
      - name: Remove workflow and push
        shell: bash
        run: |
          rm .github/workflows/fix-last-source-neutrality.yml
          git add .github/workflows/fix-last-source-neutrality.yml
          git commit -m "chore: remove final source-neutrality cleanup workflow"
          git push origin HEAD:master
