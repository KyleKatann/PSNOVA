name: one-time source-neutrality audit 2

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit broad source-dependent wording
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          patterns = [
              r'Wiki', r'wiki', r'攻略Wiki', r'原典', r'原文', r'転載', r'移植',
              r'アーカイブ', r'参考元', r'参考資料', r'出典', r'元ページ', r'元データ', r'データ元',
              r'Tipsでは', r'記録されている', r'記録されていた', r'記録として',
              r'記載されている', r'記載されていた', r'資料では', r'情報源',
          ]
          pattern = re.compile('|'.join(patterns))
          hits = []
          for path in Path('docs').rglob('*.html'):
              if '分類中' in path.parts:
                  continue
              for lineno, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if pattern.search(line):
                      hits.append((str(path), lineno, line.strip()))
          print(f'HIT_COUNT={len(hits)}')
          for path, lineno, line in hits:
              print(f'{path}:{lineno}: {line}')
          PY
      - name: Remove audit workflow
        shell: bash
        run: |
          rm .github/workflows/audit-source-neutrality-2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/audit-source-neutrality-2.yml
          git commit -m "chore: remove second source-neutrality audit workflow"
          git push origin HEAD:master
