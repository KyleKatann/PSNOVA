name: one-time public provenance cleanup

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix public provenance wording one page at a time
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+KyleKatann@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          changes = [
              (
                  Path('docs/pages/traits.html'),
                  'fix: make traits copy source-neutral',
                  {
                      'クルーに付与される「特徴」の効果を、アークス系、キャラクター特徴、ショップ系、施設系、BURST系に分けてまとめる。旧PSNOVA攻略Wikiに残る数値・表記を基本に移植している。':
                      'クルーに付与される「特徴」の効果を、アークス系、キャラクター特徴、ショップ系、施設系、BURST系に分けてまとめる。効果値や表記を一覧で確認できる。配属や育成方針を決める際の比較に利用できる。',
                      'ガーネットの特徴。旧Wiki注記: 経験値は機能していない':
