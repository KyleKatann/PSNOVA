                      '注: 旧Wikiでは「太陽の防具職人」「銀河の防具職人」「宇宙の防具職人」の効果欄が、防具ショップ配属にもかかわらず「武器★13~15の素材減」と記載されているため、そのまま保持している。また「コスト削減府部長」および精錬/製錬の表記揺れも原文を保持している。':
                      '注: 「太陽の防具職人」「銀河の防具職人」「宇宙の防具職人」は防具ショップ配属だが、効果欄は「武器★13~15の素材減」となっている。また「コスト削減府部長」および精錬/製錬には表記揺れがある。',
                  },
              ),
              (
                  Path('docs/pages/walkthrough.html'),
                  'fix: make walkthrough copy source-neutral',
                  {
                      '本編の進行を旧PSNOVA攻略Wikiのあらすじ順に整理した攻略チャート。クリア済みイベントはゲーム内の「あらすじ」、一度見たムービーは「シアタースコープ」から確認できる。':
                      '本編の進行をゲーム内の「あらすじ」順に整理した攻略チャート。ストーリークエスト、NPC同行、難易度や施設の解禁条件を時系列で確認できる。クリア済みイベントは「あらすじ」、一度見たムービーは「シアタースコープ」から確認できる。',
                      '難易度「ベリーハード」が解禁される。旧Wikiでは「惑星の真実Ⅱ」クリア時点で解禁される場合もあるとの注記がある。':
                      '難易度「ベリーハード」が解禁される。「惑星の真実Ⅱ」クリア時点で解禁される場合もある。',
                      '旧Wikiでは「難:」後半の急激な難度上昇に備え、クラスLv101習得スキルまたはLv21グランアーツ・テクニックの習得を推奨している。':
                      '「難:」後半は急激に難度が上がるため、クラスLv101習得スキルまたはLv21グランアーツ・テクニックの習得を推奨する。',
                      '友好度表記の閾値は旧Wikiでも「?」付き。':
                      '友好度表記の閾値には「?」が付いており、正確な境界は不明。',
                      '旧Wikiの閾値表記は「?」付き。':
                      '友好度表記の閾値には「?」が付いており、正確な境界は不明。',
                  },
              ),
              (
                  Path('docs/pages/tips-bugs.html'),
                  'fix: make tips and bugs copy source-neutral',
                  {
                      '旧PSNOVA攻略Wikiに残る小技、小ネタ、稼ぎ情報、既知の不具合を整理して掲載する。不具合はゲームバージョンによって挙動が異なるため、修正バージョンが判明しているものは明記する。':
                      'PSNOVAの小技、小ネタ、稼ぎ情報、状態異常、既知の不具合をまとめる。不具合はゲームバージョンによって挙動が異なるため、修正バージョンが判明しているものは明記する。稼ぎ方の比較や、不具合を避ける際の確認に利用できる。',
                      'Lv70~80以降は「難:グラン水源殲滅任務」でクリトロクィーンを打ち止めまで倒す方法が旧Wikiで推奨されている。':
                      'Lv70~80以降は「難:グラン水源殲滅任務」でクリトロクィーンを打ち止めまで倒す方法が有効。',
                      'キサラのアルマラッピー・オナー討伐プロミスオーダーは、旧Wikiでは1回10000Gとされている。':
                      'キサラのアルマラッピー・オナー討伐プロミスオーダーは、1回10000G。',
                      '旧Wikiでは、メモリーフラグメントやグランピースよりエネミー固有ドロップ判定が優先されるため、アイテム探索装置にはラッキーライザーよりダウジンガー持ちを優先することを推奨している。':
                      'メモリーフラグメントやグランピースよりエネミー固有ドロップ判定が優先されるため、アイテム探索装置にはラッキーライザーよりダウジンガー持ちを優先するとよい。',
                      '旧Wikiの「地の底へ」VH、グランブースター+40%の例では、':
                      '「地の底へ」VH、グランブースター+40%の例では、',
                      '旧Wikiでもバグ寄りの挙動として扱われているため、':
                      'バグ寄りの挙動であるため、',
                      '旧WikiではVer.1.05頃から、名称末尾に「◆」が付くDLCアイテムを生産可能になったため、':
                      'Ver.1.05頃から、名称末尾に「◆」が付くDLCアイテムを生産可能になったため、',
                      '旧WikiではPSNOVAの舞台を新光歴A.P.238年として整理し、PSO2 EP1・EP2と同じ年に相当するとしている。':
                      'PSNOVAの舞台は新光歴A.P.238年で、PSO2 EP1・EP2と同じ年に相当する。',
                      '旧Wikiでの解読結果は「test test test 11」で、':
                      '解読結果は「test test test 11」で、',
                      '以下は旧Wikiに記録されていた挙動。再現条件や現在の発生有無が公式に確認できないものは、旧Wiki記録として掲載する。':
                      '以下は再現条件や現在の発生有無を公式に確認できない挙動。環境によっては再現しない可能性がある。',
                      '体験版のプレイ時間だけが引き継がれると旧Wikiに記録されている。':
                      '体験版のプレイ時間だけが引き継がれる場合がある。',
                      'エラー終了することがあると旧Wikiに記録されている。':
                      'エラー終了することがある。',
                      '旧Wikiではダブルセイバー固有の表示問題として記録されている。':
                      'ダブルセイバー固有の表示問題である。',
                      'マルチプレイカウンターを利用できなくなるケースが旧Wikiに記録されている。':
                      'マルチプレイカウンターを利用できなくなるケースがある。',
                      'この手順後は、再び機械タイプのキャストヘッドパーツへ戻しても再発しないと旧Wikiには記録されている。':
                      'この手順後は、再び機械タイプのキャストヘッドパーツへ戻しても再発しない場合がある。',
                  },
              ),
              (
                  Path('docs/pages/technic/thunder.html'),
                  'fix: remove source provenance from thunder technic',
                  {
                      'レベル差による効果の違いは原典でも不明。':
                      'レベル差による効果の違いは不明。',
                  },
              ),
          ]

          forbidden = ('旧PSNOVA攻略Wiki', '旧Wiki', '旧wiki', '原典')

          for path, message, replacements in changes:
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one match for {old!r}, got {count}')
                  text = text.replace(old, new)
              for phrase in forbidden:
                  if phrase in text:
                      raise SystemExit(f'{path}: forbidden wording remains: {phrase}')
              path.write_text(text, encoding='utf-8')
              subprocess.run(['git', 'add', str(path)], check=True)
              subprocess.run(['git', 'commit', '-m', message], check=True)
          PY
      - name: Strengthen provenance regression test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/test_public_copy_source_provenance.py')
          text = path.read_text(encoding='utf-8')
          old = '''PROHIBITED_SOURCE_PROVENANCE = (\n    "原典",\n    "旧Wikiでは",\n    "旧wikiでは",\n    "アーカイブでは",\n    "参考元では",\n    "移植元では",\n    "元ページでは",\n    "出典では",\n)'''
          new = '''PROHIBITED_SOURCE_PROVENANCE = (\n    "原典",\n    "旧PSNOVA攻略Wiki",\n    "旧Wiki",\n    "旧wiki",\n    "アーカイブでは",\n    "参考元では",\n    "移植元では",\n    "元ページでは",\n    "出典では",\n)'''
          if text.count(old) != 1:
              raise SystemExit('expected provenance tuple not found exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git add tests/test_public_copy_source_provenance.py
          git commit -m "test: reject all old wiki provenance wording"
      - name: Verify public provenance cleanup
        shell: bash
        run: |
          python3 -m pytest tests/test_public_copy_source_provenance.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          pattern = re.compile(r'旧PSNOVA攻略Wiki|旧Wiki|旧wiki|原典|アーカイブでは|参考元では|移植元では|元ページでは|出典では')
          hits = []
          for path in Path('docs').rglob('*.html'):
              if '分類中' in path.parts:
                  continue
              for lineno, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if pattern.search(line):
                      hits.append(f'{path}:{lineno}: {line.strip()}')
          if hits:
              raise SystemExit('public provenance remains:\n' + '\n'.join(hits))
          print('public provenance hits: 0')
          PY
      - name: Remove cleanup workflow and push commits
        shell: bash
        run: |
          rm .github/workflows/fix-public-provenance.yml
          git add .github/workflows/fix-public-provenance.yml
          git commit -m "chore: remove one-time provenance cleanup workflow"
          git push origin HEAD:master
