name: Cold sleep static migration

on:
  push:
    paths:
      - ".github/workflows/coldsleep-migrate.yml"

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message == 'run cold sleep static migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest master
        run: git pull --rebase origin master
      - name: Install parser and test runner
        run: python -m pip install beautifulsoup4 pytest
      - name: Generate static page
        run: python tools/migrate_coldsleep.py
      - name: Remove obsolete iframe copy and temporary workflow
        run: |
          rm -rf docs/pages/coldsleep-reference
          rm .github/workflows/coldsleep-migrate.yml
      - name: Add regression test
        run: |
          cat > tests/test_coldsleep_static_page.py <<'PY'
          from pathlib import Path

          PAGE = Path("docs/pages/npc-coldsleep.html")

          def test_coldsleep_is_static_and_complete_enough():
              html = PAGE.read_text(encoding="utf-8")
              lowered = html.lower()
              for token in ("<iframe", "<object", "<embed", "web.archive.org", "cmd=table_edit2", "cmd=secedit"):
                  assert token not in lowered
              for heading in (
                  "ジェネラリストクルー", "ソルジャークルー", "サポートクルー",
                  "レジェンドクルー", "セクションリーダークルー", "施設スキルキャラ一覧",
              ):
                  assert heading in html
              for sentinel in ("アオイ", "アディーン", "ヴァルメン", "クシード", "リューフィ", "クラスカウンター"):
                  assert sentinel in html
              assert html.count('<table class="npc-table">') >= 18
              assert html.count("<tbody>") == html.count('<table class="npc-table">')
          PY
      - name: Validate generated page
        run: |
          python -m pytest tests/test_coldsleep_static_page.py -q
          git diff --check
          ! grep -qi '<iframe\|<object\|<embed' docs/pages/npc-coldsleep.html
      - name: Commit static migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/pages/npc-coldsleep.html tests/test_coldsleep_static_page.py
          git add -A docs/pages/coldsleep-reference .github/workflows/coldsleep-migrate.yml
          git commit -m "replace cold sleep iframe with static data"
          for attempt in 1 2 3; do
            if git pull --rebase origin master && git push origin master; then
              exit 0
            fi
            sleep 2
          done
          exit 1
