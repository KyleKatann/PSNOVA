name: one-time traits content inspection

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install parser
        run: python -m pip install beautifulsoup4
      - name: Compare source and public trait rows for manual review
        shell: bash
        run: |
          python3 - <<'PY'
          from bs4 import BeautifulSoup, Tag
          from pathlib import Path
          import re

          src_path=Path('reference/psnovanet/psnova/特徴 - ファンタシースターノヴァ PSNOVA 攻略Wiki.html')
          pub_path=Path('docs/pages/traits.html')

          def norm(s): return re.sub(r'\s+',' ',s).strip()
          def rows(table, source=False):
              result=[]
              for tr in table.find_all('tr'):
                  vals=[]
                  for cell in tr.find_all(['th','td'],recursive=False):
                      clone=BeautifulSoup(str(cell),'html.parser')
                      for img in clone.find_all('img'): img.decompose()
                      for a in clone.find_all('a'): a.unwrap()
                      text=norm(clone.get_text(' ',strip=True))
                      # PukiWiki's edit column becomes empty after image removal.
                      if source and not text:
                          continue
                      vals.append(text)
                  if vals and any(vals): result.append(vals)
              return result

          pub=BeautifulSoup(pub_path.read_text(encoding='utf-8'),'html.parser')
          src=BeautifulSoup(src_path.read_text(encoding='utf-8'),'html.parser')
          anchor=src.find(id='content_1_0'); root=anchor.parent if anchor else src.find(id='content') or src

          print('='*100+'\nPUBLIC TRAITS')
          for h in pub.find('main',id='main').find_all(['h2','h3']):
              title=norm(h.get_text(' ',strip=True))
              print(f'\n{h.name.upper()} {title}')
              table=h.find_next_sibling('table')
              if table:
                  rr=rows(table)
                  print('  ROW_COUNT',len(rr)-1 if rr else 0)
                  for r in rr: print('  |',' | '.join(r))
              else:
                  n=h.find_next_sibling()
                  if n and getattr(n,'name',None)=='p': print('  ->',norm(n.get_text(' ',strip=True)))

          print('\n'+'='*100+'\nSOURCE TRAITS')
          started=False
          for h in root.find_all(['h2','h3']):
              title=norm(h.get_text(' ',strip=True)); title=re.sub(r'^添付\s*','',title)
              if title.startswith('コメント'): break
              if not started:
                  if '特徴' not in title: continue
                  started=True
              print(f'\n{h.name.upper()} {title}')
              table=h.find_next_sibling('table')
              if table:
                  rr=rows(table,source=True)
                  print('  ROW_COUNT',len(rr)-1 if rr else 0)
                  for r in rr: print('  |',' | '.join(r))
              else:
                  payload=[]; n=h.next_sibling
                  while n is not None:
                      if isinstance(n,Tag) and n.name in ('h2','h3'): break
                      if isinstance(n,Tag) and n.name in ('p','ul'):
                          text=norm(n.get_text(' ',strip=True))
                          if text: payload.append(text)
                      n=n.next_sibling
                  for p in payload: print('  ->',p)
          PY
      - name: Remove inspection workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/inspect-traits-content.yml
          git add .github/workflows/inspect-traits-content.yml
          git commit -m "chore: remove traits content inspection workflow"
          git push origin HEAD:master
